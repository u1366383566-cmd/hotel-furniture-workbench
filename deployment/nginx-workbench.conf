# nginx 配置模板（生产身份认证要求，计划第十五节）
#
# 信任边界三原则（必须同时满足）：
# 1. location 级 proxy_set_header 会替换客户端同名伪造头（不透传），
#    本模板只保留唯一注入点，注入 $verified_*；
# 2. auth_request 向门户/license-service 校验 JWT，校验通过后由门户把
#    已验证身份写入响应头，nginx 再转发给后端；
# 3. 后端以 WORKBENCH_AUTH_MODE=trusted_proxy 运行，缺失身份头直接 401。
#
# nginx 行为核验：同层重复同名 proxy_set_header 以最后一条为准；
# 变量为空字符串时该头不发送。因此 $verified_* 为空 → 身份头被丢弃
# → 后端 trusted_proxy 模式 401 兜底，不存在伪造头透传路径。
#
# 注意：本模板尚未在真实门户 auth_request 链路上验证（需 nginx -t
# 与真实门户联调），不宣称生产可用。
#
# 安装: sudo cp nginx-workbench.conf /etc/nginx/sites-available/hotel-furniture-workbench.conf
#       sudo ln -s /etc/nginx/sites-available/hotel-furniture-workbench.conf /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name workbench.internal.example.com;   # 按实际域名/内网 DNS 修改

    # 不缓存 API；静态资源允许缓存
    location /api/ {
        # 门户/JWT 校验：子请求返回 2xx 才放行
        auth_request /_workbench_auth;
        auth_request_set $verified_role $upstream_http_x_verified_role;
        auth_request_set $verified_user $upstream_http_x_verified_user;

        # 唯一注入点: 替换客户端同名伪造头; $verified_* 为空时头不发送
        proxy_set_header X-User-Role $verified_role;
        proxy_set_header X-User-ID $verified_user;

        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 门户校验端点（license-service / 门户按实际地址修改）
    # 门户校验成功时必须在响应头返回 X-Verified-Role / X-Verified-User
    location = /_workbench_auth {
        internal;
        proxy_pass http://127.0.0.1:PORTAL_PORT/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;   # 透传 JWT
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-ID "";
    }

    location / {
        auth_request /_workbench_auth;
        auth_request_set $verified_role $upstream_http_x_verified_role;
        auth_request_set $verified_user $upstream_http_x_verified_user;
        # 唯一注入点: 替换客户端同名伪造头; $verified_* 为空时头不发送
        proxy_set_header X-User-Role $verified_role;
        proxy_set_header X-User-ID $verified_user;
        proxy_pass http://127.0.0.1:8021;
        proxy_set_header Host $host;
    }
}
