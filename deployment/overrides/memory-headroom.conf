# 90 has an 11 GiB host; keep a bounded service limit while observing
# simultaneous image processing and web traffic after the 1 GiB OOM.
[Service]
MemoryMax=1536M
# Image requests and NAS transfers can exceed systemd's default stop window.
# Give in-flight work time to finish rather than killing the service mid-request.
TimeoutStopSec=15min
